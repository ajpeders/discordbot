server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # If /api reaches this container at all, routing is wrong. Return an error
    # instead of serving index.html, which the frontend would then try to parse as JSON.
    location /api/ {
        return 502;
    }

    # SPA: any unknown route falls back to index.html so the client-side router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
